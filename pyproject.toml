[project]
name = "kast-action-bootstrap"
version = "0.2.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = ["ruff==0.14.0", "pyright[nodejs]==1.1.407", "pytest==9.0.3"]

[tool.uv]
package = false
no-build = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["setup_kast.py", "tests", "bin/install-kast"]
reportUnusedCallResult = "error"
reportMatchNotExhaustive = "error"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-include = ["bin/install-kast"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib -ra"
testpaths = ["tests"]
pythonpath = ["."]
