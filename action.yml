name: Setup Kast
description: Install a digest-pinned isolated Kast runtime on Linux x86_64
author: amichne

inputs:
  version:
    description: Exact numeric Kast component version in the setup bundle
    required: true
  artifact-url:
    description: URL for a complete Kast Linux x86_64 tar.gz archive
    required: true
  artifact-sha256:
    description: SHA-256 digest of the complete archive
    required: true
  install-dir:
    description: New canonical installation root with a short path for Unix sockets
    required: false
    default: /opt/kast
  authorization-header:
    description: Optional Authorization header for the HTTPS artifact origin
    required: false
  download-timeout-ms:
    description: Timeout for the artifact download in milliseconds
    required: false
    default: "600000"

outputs:
  kast-command:
    description: Installed Kast wrapper with its private Host profile
  kast-task-command:
    description: Installed command that grants trust for the exact task workspace
  install-root:
    description: Owned installation root

runs:
  using: node24
  main: dist/index.js

branding:
  icon: terminal
  color: purple
