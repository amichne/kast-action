name: Setup Kast
description: Install a digest-pinned composed Kast distribution on Linux x86_64
author: amichne

inputs:
  version:
    description: Exact numeric Kast component version in the setup bundle
    required: true
  artifact-url:
    description: HTTPS or file URL for a KAST_COMPOSED_SETUP_V1 tar.gz bundle
    required: true
  artifact-sha256:
    description: SHA-256 digest of the complete setup bundle
    required: true
  install-dir:
    description: New canonical installation root with a short path for Unix sockets
    required: false
    default: /opt/kast
  trust-workspace:
    description: Optional exact repository root whose build code the caller explicitly trusts
    required: false
  authorization-header:
    description: Optional Authorization header for the artifact origin
    required: false
  download-timeout-ms:
    description: Timeout for the artifact download in milliseconds
    required: false
    default: "600000"

outputs:
  kast-command:
    description: Installed Kast wrapper with its private Host profile
  install-root:
    description: Owned installation root

runs:
  using: node24
  main: dist/index.js

branding:
  icon: terminal
  color: purple
