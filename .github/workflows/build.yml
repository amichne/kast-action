name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: mise exec -- uv run --locked ruff format --check .
      - run: mise exec -- uv run --locked ruff check .
      - run: mise exec -- uv run --locked pyright
      - run: mise exec -- uv run --locked pytest -q
      - run: mise exec -- uv run --locked --script bin/install-kast --help
      - name: Examine generated action entry
        run: git diff --exit-code -- dist/index.js
